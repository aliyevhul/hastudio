<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="1080" height="1080" fill="#0b0c0e"/><circle cx="1020" cy="-40" r="300" fill="#c8f24e" opacity="0.07"/><text x="84" y="1004" font-family="Inter" font-size="20" font-weight="500" fill="#9b9da2" text-anchor="start" letter-spacing="0">hastudio-az.vercel.app</text><text x="996" y="1004" font-family="Inter" font-size="20" font-weight="700" fill="#c8f24e" text-anchor="end" letter-spacing="0">2/5</text><text x="84" y="114" font-family="Inter" font-size="21" font-weight="700" fill="#c8f24e" text-anchor="start" letter-spacing="4">01 · KAFE</text><text x="84" y="192" font-family="Inter" font-size="56" font-weight="800" fill="#edecea" text-anchor="start" letter-spacing="0">Menyu birinci,</text><text x="84" y="260" font-family="Inter" font-size="56" font-weight="800" fill="#c8f24e" text-anchor="start" letter-spacing="0">mətn sonra.</text><rect x="84" y="330" width="300" height="560" rx="34" fill="#131519" stroke="#262a31" stroke-width="2"/><rect x="200.0" y="346" width="68" height="7" rx="3.5" fill="#262a31"/><rect x="104" y="374" width="260" height="150" rx="14" fill="#1a1d22"/><circle cx="234" cy="444" r="34" fill="none" stroke="#c8f24e" stroke-width="3" opacity="0.65"/><rect x="216" y="436" width="36" height="22" rx="5" fill="#c8f24e" opacity="0.65"/><rect x="104" y="546" width="260" height="58" rx="29" fill="#c8f24e"/><text x="234" y="583" font-family="Inter" font-size="24" font-weight="800" fill="#0b0c0e" text-anchor="middle" letter-spacing="1">MENYU</text><rect x="104" y="622" width="124" height="50" rx="25" fill="none" stroke="#262a31" stroke-width="2"/><text x="166" y="653" font-family="Inter" font-size="20" font-weight="600" fill="#edecea" text-anchor="middle" letter-spacing="0">Zəng</text><rect x="240" y="622" width="124" height="50" rx="25" fill="none" stroke="#262a31" stroke-width="2"/><text x="302" y="653" font-family="Inter" font-size="20" font-weight="600" fill="#edecea" text-anchor="middle" letter-spacing="0">Xəritə</text><rect x="104" y="696" width="230" height="10" rx="5" fill="#262a31"/><rect x="104" y="722" width="190" height="10" rx="5" fill="#262a31"/><rect x="104" y="748" width="250" height="10" rx="5" fill="#262a31"/><rect x="104" y="774" width="150" height="10" rx="5" fill="#262a31"/><text x="456" y="372" font-family="Inter" font-size="26" font-weight="400" fill="#9b9da2" text-anchor="start" letter-spacing="0">Kafe saytına girən adam üç şeyi</text><text x="456" y="412" font-family="Inter" font-size="26" font-weight="400" fill="#9b9da2" text-anchor="start" letter-spacing="0">axtarır: menyu, ünvan, iş saatı.</text><text x="456" y="492" font-family="Inter" font-size="26" font-weight="400" fill="#9b9da2" text-anchor="start" letter-spacing="0">Ona görə ilk ekranda uzun mətn</text><text x="456" y="532" font-family="Inter" font-size="26" font-weight="400" fill="#9b9da2" text-anchor="start" letter-spacing="0">olmur — böyük «Menyu» düyməsi,</text><text x="456" y="572" font-family="Inter" font-size="26" font-weight="400" fill="#9b9da2" text-anchor="start" letter-spacing="0">zəng və xəritə düymələri olur.</text><rect x="456" y="656" width="6" height="106" fill="#c8f24e" rx="3"/><text x="482" y="680" font-family="Inter" font-size="17" font-weight="700" fill="#c8f24e" text-anchor="start" letter-spacing="3">PRİNSİP</text><text x="482" y="718" font-family="Inter" font-size="25" font-weight="600" fill="#edecea" text-anchor="start" letter-spacing="0">Ən çox istənilən əməliyyat</text><text x="482" y="754" font-family="Inter" font-size="25" font-weight="600" fill="#edecea" text-anchor="start" letter-spacing="0">ən böyük düymədir.</text></svg>